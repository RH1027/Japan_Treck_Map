<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Japan Trek Food Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: navy header + city tabs; shop list on the left, map on the right (stacked on phones). */
:root {
  --navy: #14213D;
  --yellow: #FFC93C;
  --bg: #F3F5F8;
  --card: #FFFFFF;
  --line: #DCE2EA;
  --text: #33405A;
  --muted: #5B6B82;
  --link: #1F4FD8;
  --display: 'Outfit', 'Noto Sans JP', system-ui, sans-serif;
  --body: 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--navy); font-family: var(--body); display: flex; flex-direction: column; }
header { background: var(--navy); color: #fff; padding: 14px max(16px, env(safe-area-inset-left)) 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--yellow); font-weight: 700; }
h1 { margin: 2px 0 0; font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.15; }
.count { font-size: 12px; color: #C9D2DE; }
nav { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
nav button { appearance: none; border: 0; background: transparent; color: #C9D2DE; font: 600 14px var(--display); padding: 10px 14px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { background: var(--bg); color: var(--navy); }
nav button:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
nav .n { font-size: 11px; opacity: .7; margin-left: 4px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
#list { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); }
#map { min-height: 300px; }
.shop { text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font: inherit; color: inherit; }
.shop:hover { border-color: #AEB9C9; }
.shop[aria-current="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
.shop:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.num { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--yellow); font: 700 11px var(--body); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.shop h2 { margin: 0; font: 700 16px/1.25 var(--display); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; color: var(--muted); align-items: center; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--bg); }
.chip.res-yes { border-color: #E3B341; background: #FFF6DB; color: #7A5600; }
.shop p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rates { display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rate { font-size: 11px; color: var(--muted); }
.rate b { color: #B7791F; font-weight: 700; }
.asof { font-size: 10px; color: var(--muted); }
.jp { font: 400 11px var(--body); color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 8px 2px; }
.pin { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--yellow); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); font: 700 12px var(--body); display: flex; align-items: center; justify-content: center; }
.pin.active { background: var(--yellow); color: var(--navy); border-color: var(--navy); }
.maplibregl-popup-content { padding: 12px 14px; font-family: var(--body); border-radius: 8px; }
.maplibregl-popup-close-button { font-size: 18px; padding: 0 6px; }
.pop { width: 260px; }
.marker { cursor: pointer; }
.pop h3 { margin: 0; font: 700 16px/1.25 var(--display); color: var(--navy); }
.pop .meta { margin-top: 4px; }
.pop p { margin: 8px 0 0; font-size: 12px; line-height: 1.55; color: var(--text); }
.pop .note { font-size: 11px; color: #7A5600; background: #FFF6DB; border-radius: 4px; padding: 6px 8px; }
.pop .addr { font-size: 11px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.links a { font-size: 12px; font-weight: 700; text-decoration: none; color: var(--navy); border: 1px solid var(--navy); border-radius: 999px; padding: 4px 10px; }
.links a:hover { background: var(--navy); color: #fff; }
footer { font-size: 10px; color: var(--muted); padding: 6px max(16px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: var(--bg); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 45vh auto; overflow-y: auto; }
  #map { order: 1; }
  #list { order: 2; overflow: visible; border-right: 0; }
  body { height: auto; min-height: 100%; }
  main { flex: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <div class="eyebrow">JAPAN TREK · RECOMMENDED BY THE ORGANIZERS</div>
      <h1>Japan Trek Food Map</h1>
    </div>
    <div class="count" id="count"></div>
  </div>
  <nav id="tabs" role="tablist" aria-label="City"></nav>
</header>
<main>
  <section id="list" aria-label="Restaurants"></section>
  <div id="map" role="region" aria-label="Map"></div>
</main>
<footer>Recommendations by the Japan Trek organizers. Hours and details can change, so please check each restaurant's page before you go.</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const CITY_VIEW = {
  Tokyo: [[35.6812, 139.7671], 12],
  Kyoto: [[35.0116, 135.7681], 13],
  Osaka: [[34.6937, 135.5023], 13],
  Hiroshima: [[34.3853, 132.4553], 13],
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [139.7671, 35.6812], zoom: 12,
  attributionControl: { compact: false },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
// Show English names where OpenStreetMap has them, otherwise the local name.
map.on('style.load', () => {
  const en = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name']];
  for (const l of map.getStyle().layers) {
    if (l.type === 'symbol' && l.layout && l.layout['text-field'] && JSON.stringify(l.layout['text-field']).includes('name')) {
      map.setLayoutProperty(l.id, 'text-field', en);
    }
  }
});

let data = { cities: [] }, city = null, markers = [];
const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');

function gmapUrl(s) {
  if (s.gmap) return s.gmap.url;
  if (s.hp && /google map/i.test(s.hp.label || '')) return s.hp.url;
  const q = [s.name, s.address].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
function resChip(r) {
  if (!r) return '';
  const yes = /^y/i.test(r);
  return `<span class="chip ${yes ? 'res-yes' : ''}">${yes ? 'Reservation recommended' : 'No reservation'}</span>`;
}
function fmtNum(v, d) { const n = parseFloat(v); return isNaN(n) ? esc(v) : n.toFixed(d); }
function ratingsHtml(s, withDate) {
  const parts = [];
  if (s.google_rating) parts.push(`<span class="rate"><b>★ ${fmtNum(s.google_rating, 1)}</b> Google</span>`);
  if (s.tabelog_rating) parts.push(`<span class="rate"><b>★ ${fmtNum(s.tabelog_rating, 2)}</b> Tabelog</span>`);
  if (!parts.length) return '';
  const date = withDate && s.rating_date ? `<span class="asof">as of ${esc(String(s.rating_date).slice(0, 10))}</span>` : '';
  return `<span class="rates">${parts.join('')}${date}</span>`;
}
function popupHtml(s) {
  const links = [];
  if (s.hp && !/google map/i.test(s.hp.label || '')) links.push(`<a href="${esc(s.hp.url)}" target="_blank" rel="noopener">${esc(s.hp.label === 'HP' ? 'Website' : s.hp.label)}</a>`);
  if (s.tabelog) links.push(`<a href="${esc(s.tabelog.url)}" target="_blank" rel="noopener">Tabelog</a>`);
  links.push(`<a href="${esc(gmapUrl(s))}" target="_blank" rel="noopener">Google Maps</a>`);
  return `<div class="pop">
    <h3>${esc(s.name)}${s.name_jp ? ` <span class="jp">${esc(s.name_jp)}</span>` : ''}</h3>
    <div class="meta">${s.area ? `<span>${esc(s.area)}</span>` : ''}${resChip(s.reservation)}</div>
    ${ratingsHtml(s, true) ? `<div class="meta">${ratingsHtml(s, true)}</div>` : ''}
    ${s.description ? `<p>${esc(s.description)}</p>` : ''}
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}
    ${s.address ? `<p class="addr">${esc(s.address)}</p>` : ''}
    <div class="links">${links.join('')}</div>
  </div>`;
}
function closeAll() { markers.forEach(m => m && m.getPopup().isOpen() && m.togglePopup()); }
function select(i, fly) {
  markers.forEach((m, j) => { if (m) m.getElement().querySelector('.pin').classList.toggle('active', j === i); });
  [...listEl.querySelectorAll('.shop')].forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
  const m = markers[i];
  if (!m) return;
  closeAll();
  if (fly) {
    if (window.matchMedia('(max-width: 760px)').matches) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
    map.once('moveend', () => { if (!m.getPopup().isOpen()) m.togglePopup(); });
    map.flyTo({ center: m.getLngLat(), zoom: Math.max(map.getZoom(), 15.5), offset: [0, 120], duration: 700 });
  } else if (!m.getPopup().isOpen()) m.togglePopup();
}
function showCity(name) {
  city = data.cities.find(c => c.city === name) || data.cities[0];
  [...tabsEl.children].forEach(b => b.setAttribute('aria-selected', b.dataset.city === city.city ? 'true' : 'false'));
  markers.forEach(m => m && m.remove());
  markers = [];
  listEl.innerHTML = '';
  const shops = city.shops;
  if (!shops.length) {
    listEl.innerHTML = `<div class="empty">No recommendations for ${esc(city.city)} yet. Check back soon.</div>`;
  }
  shops.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'shop';
    b.innerHTML = `<span class="num">${i + 1}</span><span style="min-width:0">
      <h2>${esc(s.name)}${s.name_jp ? ` <span class="jp">${esc(s.name_jp)}</span>` : ''}</h2>
      <span class="meta">${s.area ? `<span>${esc(s.area)}</span>` : ''}${resChip(s.reservation)}${ratingsHtml(s, false)}</span>
      ${s.description ? `<p>${esc(s.description)}</p>` : ''}</span>`;
    b.addEventListener('click', () => select(i, true));
    listEl.appendChild(b);
    if (s.lat != null && s.lng != null) {
      const el = document.createElement('div');
      el.className = 'marker';
      el.innerHTML = `<div class="pin">${i + 1}</div>`;
      el.title = s.name;
      const popup = new maplibregl.Popup({ offset: 16, maxWidth: '300px', focusAfterOpen: false }).setHTML(popupHtml(s));
      const m = new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).setPopup(popup).addTo(map);
      el.addEventListener('click', () => setTimeout(() => select(i, false), 0));
      markers.push(m);
    } else markers.push(null);
  });
  const pts = markers.filter(Boolean).map(m => m.getLngLat());
  if (pts.length > 1) {
    const bb = new maplibregl.LngLatBounds(pts[0], pts[0]);
    pts.forEach(p => bb.extend(p));
    map.fitBounds(bb, { padding: 60, maxZoom: 15, duration: 0 });
  } else if (pts.length === 1) map.jumpTo({ center: pts[0], zoom: 15 });
  else { const v = CITY_VIEW[city.city] || CITY_VIEW.Tokyo; map.jumpTo({ center: [v[0][1], v[0][0]], zoom: v[1] }); }
  try { localStorage.setItem('city', city.city); } catch (e) {}
  if (location.hash.slice(1) !== city.city) history.replaceState(null, '', '#' + city.city);
}

fetch('data/shops.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  data = d;
  const total = d.cities.reduce((n, c) => n + c.shops.length, 0);
  document.getElementById('count').textContent = `${total} place${total === 1 ? '' : 's'}`;
  d.cities.forEach(c => {
    const b = document.createElement('button');
    b.role = 'tab'; b.dataset.city = c.city;
    b.innerHTML = `${esc(c.city)}<span class="n">${c.shops.length}</span>`;
    b.addEventListener('click', () => showCity(c.city));
    tabsEl.appendChild(b);
  });
  let start = decodeURIComponent(location.hash.slice(1));
  if (!d.cities.some(c => c.city === start)) { try { start = localStorage.getItem('city'); } catch (e) { start = null; } }
  showCity(start);
}).catch(() => {
  listEl.innerHTML = '<div class="empty">The restaurant list could not be loaded. Please refresh the page.</div>';
});
</script>
</body>
</html>
